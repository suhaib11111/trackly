# Free Supabase projects pause after a week without activity.
# This asks the database one tiny question every day, so Trackly stays awake.
# (GitHub stops scheduled jobs after 60 days without any commits; any push turns it back on.)
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC (09:17 Erbil)
  workflow_dispatch: {}     # can also be run by hand from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://lcrvuijwpvhphbuwxtny.supabase.co/rest/v1/rpc/get_shared_location" \
            -H "apikey: sb_publishable_pW_dqVXVi9PMOH8FjPpa6g_VI_GQ2rF" \
            -H "Content-Type: application/json" -d '{"p_token":"keep-alive"}')
          echo "Supabase answered: $code"
          test "$code" = "200"
